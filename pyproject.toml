[project]
name = "logger-lab"
version = "0.2.0"
description = "Composable feedback logging for Python: outputs, features, formats and catalysts on plain stdlib loggers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mosquito Lab (Cyber-Smoke)", email = "mosquitolab2024@protonmail.com" },
]
requires-python = ">=3.10"
keywords = ["logging", "logger", "feedback", "rich", "json", "structured-logging", "log-rotation", "async", "qt"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "rich>=12.6.0",
]

[project.urls]
Homepage = "https://github.com/Mosquito-Lab/logger-lab"
Repository = "https://github.com/Mosquito-Lab/logger-lab"
Issues = "https://github.com/Mosquito-Lab/logger-lab/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]  # tests/ for tests/helpers.py, as pytest imports it
